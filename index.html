    <script type="module">
        import { auth } from "./firebase-config.js";
        import { signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { verifyAdminPIN, checkAdminStatus } from "./auth-service.js";

        window.isServerVerified = false;

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                const token = await user.getIdToken();
                if (token) {
                    window.isServerVerified = true;
                }
            } else {
                window.isServerVerified = false;
            }
        });

        signInAnonymously(auth).catch(() => {
            window.isServerVerified = false;
        });

        const btnUnlock = document.getElementById("btnUnlock");
        const lockStatus = document.getElementById("lockStatus");
        const btnClearHistory = document.getElementById("btnClearHistory");

        btnUnlock.addEventListener("click", async () => {
            const inputPin = prompt("กรอก Admin PIN เพื่อปลดล็อคสิทธิ์:");
            if (!inputPin) return;

            btnUnlock.textContent = "⏳ ตรวจสอบ...";
            const isSuccess = await verifyAdminPIN(inputPin);

            if (isSuccess) {
                lockStatus.textContent = "🔓 สถานะ: UNLOCKED (สิทธิ์ Admin)";
                lockStatus.className = "status-unlocked";
                btnUnlock.style.display = "none";
                btnClearHistory.style.display = "inline-block";

            } else {
                alert("❌ PIN ไม่ถูกต้อง!");
                btnUnlock.textContent = "🔓 ปลดล็อค Admin (PIN)";
            }
        });

        window.checkAdminStatus = checkAdminStatus;

    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --border-color: #334155;
            --accent-color: #38bdf8;
            --accent-hover: #0284c7;
            --success-color: #10b981;
            --danger-color: #ef4444;
            --font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: var(--font-family);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 1100px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 15px;
        }

        .header h1 { margin: 0; font-size: 24px; color: var(--accent-color); }
        .auth-bar { display: flex; align-items: center; gap: 15px; }
        .status-locked { color: var(--danger-color); font-weight: bold; }
        .status-unlocked { color: var(--success-color); font-weight: bold; }

        button {
            background-color: var(--accent-color);
            color: #000;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover { background-color: var(--accent-hover); color: #fff; }

        .search-section { position: relative; width: 100%; }
        .search-input {
            width: 100%;
            padding: 12px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
        }

        .search-results {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 0 0 6px 6px;
            max-height: 250px;
            overflow-y: auto;
            z-index: 10;
            display: none;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        .search-item { padding: 10px; border-bottom: 1px solid var(--border-color); cursor: pointer; }
        .search-item:hover { background-color: var(--border-color); }
        .search-item .item-key { color: var(--accent-color); font-weight: bold; }
        .search-item .item-val { color: var(--text-sub); font-size: 12px; }

        .input-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        textarea {
            width: 100%;
            height: 180px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            border-radius: 6px;
            padding: 10px;
            box-sizing: border-box;
            font-family: monospace;
            resize: vertical;
        }

        .action-bar { display: flex; justify-content: flex-end; gap: 10px; }
        table {
            width: 100%;
            border-collapse: collapse;
            background: var(--card-bg);
            border-radius: 6px;
            overflow: hidden;
        }

        th, td { padding: 12px; text-align: left; border-bottom: 1px solid var(--border-color); }
        th { background-color: rgba(255, 255, 255, 0.05); color: var(--accent-color); }

        input[type="text"] {
            width: 100%;
            background: transparent;
            border: 1px solid transparent;
            color: var(--text-main);
            padding: 6px;
            border-radius: 4px;
        }
        input[type="text"]:focus { background: var(--bg-color); border-color: var(--accent-color); outline: none; }

        .btn-danger { background-color: var(--danger-color); color: #fff; }
        .btn-danger:hover { background-color: #dc2626; }
        .btn-success { background-color: var(--success-color); color: #fff; }
        .btn-success:hover { background-color: #059669; }

        .footer-info { text-align: center; color: var(--text-sub); font-size: 12px; margin-top: 20px; }
