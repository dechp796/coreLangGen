<script>
let globalCdnMap = new Map();
const MAX_CDN_HISTORY = 5;

function saveCdnUrlHistory(thUrl, enUrl) {
    if (!thUrl && !enUrl) return;
    let history = JSON.parse(localStorage.getItem('cdn_url_history') || '[]');
    const newEntry = { thUrl, enUrl, timestamp: new Date().toLocaleString() };
    history = history.filter(item => !(item.thUrl === thUrl && item.enUrl === enUrl));
    history.unshift(newEntry);
    if (history.length > MAX_CDN_HISTORY) history.pop();
    localStorage.setItem('cdn_url_history', JSON.stringify(history));
    renderCdnHistory();
}

function renderCdnHistory() {
    const container = document.getElementById('cdnHistoryContainer');
    if (!container) return;
    const history = JSON.parse(localStorage.getItem('cdn_url_history') || '[]');
    if (history.length === 0) {
        container.innerHTML = '<div style="font-size: 11px; color: #888; margin-top: 5px;">ยังไม่มีประวัติ CDN URL ล่าสุด</div>';
        return;
    }
    container.innerHTML = `<div style="margin-top: 8px; font-size: 12px; font-weight: bold; color: #333;">🕒 ประวัติ CDN URLs ล่าสุด:</div><div style="display: flex; flex-direction: column; gap: 4px; margin-top: 4px;">${history.map((item, index) => `<div style="display: flex; align-items: center; justify-content: space-between; background: #eef2f5; padding: 4px 8px; border: 1px solid #d0d7de; border-radius: 4px; font-size: 11px;"><span style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 82%;">📌 <strong>TH:</strong> ${item.thUrl ? item.thUrl.split('/').pop() : '-'} | <strong>EN:</strong> ${item.enUrl ? item.enUrl.split('/').pop() : '-'} <span style="color: #666;">(${item.timestamp})</span></span><button onclick="useCdnHistory(${index})" style="padding: 2px 6px; font-size: 10px; cursor: pointer; background: #007bff; color: white; border: none; border-radius: 3px; margin: 0;">นำมาใช้</button></div>`).join('')}</div>`;
}

function useCdnHistory(index) {
    const history = JSON.parse(localStorage.getItem('cdn_url_history') || '[]');
    const item = history[index];
    if (item) {
        document.getElementById("cdnThUrl").value = item.thUrl || "";
        document.getElementById("cdnEnUrl").value = item.enUrl || "";
    }
}

async function fetchCdnData(showAlert = false) {
    const rawThUrl = document.getElementById("cdnThUrl").value.trim();
    const rawEnUrl = document.getElementById("cdnEnUrl").value.trim();
    if (!rawThUrl && !rawEnUrl) {
        if (showAlert) alert("กรุณากรอก URL อย่างน้อย 1 ช่องครับ");
        return;
    }
    if (showAlert) saveCdnUrlHistory(rawThUrl, rawEnUrl);

    const fetchSingleUrl = async (targetUrl) => {
        const timestamp = new Date().getTime();
        const realTimeTargetUrl = targetUrl.includes('?') ? `${targetUrl}&_t=${timestamp}` : `${targetUrl}?_t=${timestamp}`;
        const proxyUrl = `http://127.0.0.1:8080/fetch-cdn?url=${encodeURIComponent(realTimeTargetUrl)}`;
        const res = await fetch(proxyUrl, { method: 'GET' });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        return await res.json();
    };

    try {
        globalCdnMap.clear();
        if (rawThUrl) parseCdnJson(await fetchSingleUrl(rawThUrl), 'thai');
        if (rawEnUrl) parseCdnJson(await fetchSingleUrl(rawEnUrl), 'eng');

        const searchInput = document.getElementById("searchInput");
        searchInput.disabled = false;
        searchInput.placeholder = "พิมพ์ KEY, ข้อความ THAI หรือ ENG เพื่อค้นหา...";

        if (showAlert) alert(`⚡ ดึงข้อมูล Real-time สำเร็จ! พบทั้งหมด ${globalCdnMap.size} Keys`);
    } catch (err) {
        if (showAlert) alert(`❌ ไม่สามารถดึงข้อมูลได้: ${err.message}`);
    }
}

function handleFileUpload(event, lang) {
    const file = event.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(e) {
        try {
            parseCdnJson(JSON.parse(e.target.result), lang);
            const searchInput = document.getElementById("searchInput");
            searchInput.disabled = false;
            searchInput.placeholder = "พิมพ์ KEY, ข้อความ THAI หรือ ENG เพื่อค้นหา...";
            alert(`อัปโหลดไฟล์ ${lang.toUpperCase()} สำเร็จ! รวมมี ${globalCdnMap.size} Keys`);
        } catch (err) {
            alert("ไฟล์ JSON ไม่ถูกต้อง");
        }
    };
    reader.readAsText(file);
}

function parseCdnJson(jsonObj, lang) {
    let targetObj = jsonObj.th || jsonObj.en || jsonObj;
    for (const [key, val] of Object.entries(targetObj)) {
        if (typeof val === 'object') continue;
        if (!globalCdnMap.has(key)) globalCdnMap.set(key, { key, eng: "", thai: "" });
        const formattedVal = String(val).replaceAll('\n', '\\n');
        const item = globalCdnMap.get(key);
        if (lang === 'thai') item.thai = formattedVal;
        if (lang === 'eng') item.eng = formattedVal;
    }
}

function handleSearch() {
    const query = document.getElementById("searchInput").value.toLowerCase().trim();
    const resultsContainer = document.getElementById("searchResults");
    if (!query) { resultsContainer.style.display = "none"; return; }

    const matches = [];
    for (const item of globalCdnMap.values()) {
        if (item.key.toLowerCase().includes(query) || String(item.eng).toLowerCase().includes(query) || String(item.thai).toLowerCase().includes(query)) {
            matches.push(item);
        }
        if (matches.length >= 25) break; 
    }

    if (matches.length > 0) {
        resultsContainer.innerHTML = matches.map(m => `<div class="search-item" onclick="selectSearchItem('${escapeHtml(m.key)}')"><div class="item-key">${m.key}</div><div class="item-val">🇬🇧 ${m.eng || '-'} | 🇹🇭 ${m.thai || '-'}</div></div>`).join('');
        resultsContainer.style.display = "block";
    } else {
        resultsContainer.innerHTML = `<div class="search-item" style="color: #999;">ไม่พบข้อมูลที่ตรงกัน</div>`;
        resultsContainer.style.display = "block";
    }
}

function escapeHtml(str) { return str.replace(/'/g, "\\'").replace(/"/g, "&quot;"); }

function selectSearchItem(key) {
    const data = globalCdnMap.get(key);
    if (!data) return;
    appendRowToMainTable(data.key, data.eng, data.thai);
    document.getElementById("searchResults").style.display = "none";
    document.getElementById("searchInput").value = "";
    saveCurrentTableToHistory();
}

function appendRowToMainTable(key, eng, thai) {
    const tbody = document.getElementById("mainTbody");
    const tr = document.createElement("tr");
    tr.draggable = true;

    tr.innerHTML = `
        <td style="border: 1px solid #000; padding: 2px 3px; vertical-align: top; white-space: pre-wrap;">${key}</td>
        <td style="border: 1px solid #000; padding: 2px 3px; vertical-align: top; white-space: pre-wrap;">${eng}</td>
        <td style="border: 1px solid #000; padding: 2px 3px; vertical-align: top; white-space: pre-wrap;">${thai}</td>
        <td class="action-col" style="border: 1px solid #000; padding: 2px; text-align: center; vertical-align: middle;">
            <span class="drag-handle">⠿</span>
            <button onclick="deleteRow(this)" style="padding: 2px 6px; font-size: 11px; background: #ffcccc;">❌</button>
        </td>
    `;
    setupMainRowDragAndDrop(tr);
    tbody.appendChild(tr);
}

function parseData(text) {
    const result = [];
    const regex = /"([^"]+)"\s*:\s*"((?:\\.|[^"\\])*)"/gs;
    let match;
    while ((match = regex.exec(text)) !== null) result.push({ key: match[1], value: match[2] });
    return result;
}

function isThaiText(text) { return /[\u0E00-\u0E7F]/.test(text); }

function generateTable() {
    const thaiText = document.getElementById("thaiInput").value;
    const engInput = document.getElementById("engInput").value;
    const allData = [...parseData(thaiText), ...parseData(engInput)];
    const tableMap = new Map();

    allData.forEach(item => {
        if (!tableMap.has(item.key)) tableMap.set(item.key, { eng: "", thai: "" });
        const entry = tableMap.get(item.key);
        if (isThaiText(item.value)) entry.thai = item.value;
        else {
            if (!entry.eng) entry.eng = item.value;
            else if (!entry.thai) entry.thai = item.value;
        }
    });

    const tbody = document.getElementById("mainTbody");
    tbody.innerHTML = "";
    tableMap.forEach((val, key) => appendRowToMainTable(key, val.eng, val.thai));
    if (tableMap.size > 0) saveCurrentTableToHistory();
}

let draggedRow = null;
function setupMainRowDragAndDrop(tr) {
    const handle = tr.querySelector('.drag-handle');
    if (handle) handle.addEventListener('mousedown', () => tr.draggable = true);
    tr.addEventListener('dragstart', function() { draggedRow = this; setTimeout(() => this.classList.add('dragging'), 0); });
    tr.addEventListener('dragend', function() { this.classList.remove('dragging'); draggedRow = null; saveCurrentTableToHistory(); });
    tr.addEventListener('dragover', function(e) { e.preventDefault(); });
    tr.addEventListener('drop', function(e) {
        e.stopPropagation();
        if (draggedRow && draggedRow !== this) {
            const tbody = this.parentNode;
            const rowsArray = Array.from(tbody.querySelectorAll('tr'));
            if (rowsArray.indexOf(draggedRow) < rowsArray.indexOf(this)) tbody.insertBefore(draggedRow, this.nextSibling);
            else tbody.insertBefore(draggedRow, this);
            saveCurrentTableToHistory();
        }
    });
}

function deleteRow(button) { button.closest('tr').remove(); saveCurrentTableToHistory(); }

function getThaiTimestamp() {
    const now = new Date();
    return `${String(now.getDate()).padStart(2, '0')}/${String(now.getMonth() + 1).padStart(2, '0')}/${now.getFullYear()} ${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}:${String(now.getSeconds()).padStart(2, '0')}`;
}

function saveCurrentTableToHistory() {
    const rows = Array.from(document.querySelectorAll("#output tbody tr"));
    if (rows.length === 0) return;
    
    const rowsHtml = rows.map(tr => {
        const tds = Array.from(tr.querySelectorAll("td:not(.action-col)")).map(td => `<td style="border:1px solid #000;padding:2px 3px;vertical-align:top;white-space:pre-wrap;">${td.textContent}</td>`).join("");
        return `<tr>${tds}</tr>`;
    }).join("");

    let history = JSON.parse(localStorage.getItem('table_history') || '[]');
    const newItem = {
        timestamp: getThaiTimestamp(),
        thaiInput: document.getElementById("thaiInput").value,
        engInput: document.getElementById("engInput").value,
        rowsHtml: rowsHtml
    };

    history.unshift(newItem);
    if (history.length > 10) history.pop();
    localStorage.setItem('table_history', JSON.stringify(history));
    renderRecentHistory();
}

function renderRecentHistory() {
    const container = document.getElementById('recentContainer');
    const history = JSON.parse(localStorage.getItem('table_history') || '[]');
    
    if (history.length === 0) {
        container.innerHTML = '<div style="color: #666; font-size: 12px;">ยังไม่มีประวัติการสร้าง</div>';
        return;
    }

    container.innerHTML = history.map((item, index) => `
        <div class="recent-item">
            <div class="recent-header">
                <span>🕒 <strong>${item.timestamp}</strong></span>
                <div>
                    <button id="toggle-btn-${index}" onclick="toggleTable(${index})">แสดงตาราง</button>
                    <button onclick="restoreFromHistory(${index}, false)" style="background: #e2f0d9;" title="เอาข้อมูลประวัติไปต่อท้ายตารางหลักเดิม">➕ ดึงมาต่อท้าย</button>
                    <button onclick="restoreFromHistory(${index}, true)" style="background: #d9edf7;" title="ล้างตารางเดิม แล้วเอาประวัตินี้มาวางแทนทั้งหมด">📥 ดึงมาทั้งหมด (แทนที่)</button>
                    <button onclick="copyRecentTable(${index})">Copy ตารางนี้</button>
                </div>
            </div>
            <div id="table-container-${index}" class="recent-table-wrapper">
                <table class="recent-table" id="recent-table-${index}">
                    <thead>
                        <tr>
                            <th style="border: 1px solid #000000; background-color: #A9D18E; width: 24.5%;">KEY</th>
                            <th style="border: 1px solid #000000; background-color: #A9D18E; width: 31.5%;">ENG</th>
                            <th style="border: 1px solid #000000; background-color: #A9D18E; width: 44%;">THAI</th>
                        </tr>
                    </thead>
                    <tbody>${item.rowsHtml}</tbody>
                </table>
            </div>
        </div>
    `).join('');
}

function restoreFromHistory(index, isReplace = false) {
    const history = JSON.parse(localStorage.getItem('table_history') || '[]');
    const selectedItem = history[index];
    if (!selectedItem) return;

    if (isReplace) {
        document.querySelector("#output tbody").innerHTML = "";
    }

    const tempDiv = document.createElement('div');
    tempDiv.innerHTML = `<table><tbody>${selectedItem.rowsHtml}</tbody></table>`;
    
    const rows = tempDiv.querySelectorAll('tr');
    let addedCount = 0;

    rows.forEach(tr => {
        const tds = tr.querySelectorAll('td');
        if (tds.length >= 3) {
            const key = tds[0].textContent.trim();
            const eng = tds[1].textContent;
            const thai = tds[2].textContent;
            
            if (key) {
                appendRowToMainTable(key, eng, thai);
                addedCount++;
            }
        }
    });

    if (selectedItem.thaiInput) document.getElementById("thaiInput").value = selectedItem.thaiInput;
    if (selectedItem.engInput) document.getElementById("engInput").value = selectedItem.engInput;

    const actionText = isReplace ? "แทนที่ตารางเดิมทั้งหมด" : "ต่อท้ายตารางหลัก";
    alert(`📥 ดึงข้อมูลประวัติ (${actionText}) เรียบร้อย! นำเข้า ${addedCount} รายการครับ`);
}

function toggleTable(index) {
    const wrapper = document.getElementById(`table-container-${index}`);
    const btn = document.getElementById(`toggle-btn-${index}`);
    if (wrapper.style.display === "block") {
        wrapper.style.display = "none";
        btn.textContent = "แสดงตาราง";
    } else {
        wrapper.style.display = "block";
        btn.textContent = "ซ่อนตาราง";
    }
}

async function copyRecentTable(index) {
    const table = document.getElementById(`recent-table-${index}`);
    if (!table) return;

    const rowsHtml = Array.from(table.querySelectorAll("tbody tr")).map(tr => {
        const tds = Array.from(tr.querySelectorAll("td")).map(td => {
            const tempTd = document.createElement("td");
            tempTd.style.cssText = "border: 1px solid #000000; padding: 2px 3px; vertical-align: top; white-space: pre-wrap;";
            tempTd.textContent = td.textContent;
            return tempTd.outerHTML;
        }).join("");
        return `<tr>${tds}</tr>`;
    }).join("");

    const styledHtml = `<table style="border-collapse: collapse; font-family: Arial, sans-serif; font-size: 13px;"><thead><tr><th style="background-color: #A9D18E; border: 1px solid #000000; text-align: center; vertical-align: middle; font-weight: normal; height: 25px; padding: 1px 3px; width: 24.5%;">KEY</th><th style="background-color: #A9D18E; border: 1px solid #000000; text-align: center; vertical-align: middle; font-weight: normal; height: 25px; padding: 1px 3px; width: 31.5%;">ENG</th><th style="background-color: #A9D18E; border: 1px solid #000000; text-align: center; vertical-align: middle; font-weight: normal; height: 25px; padding: 1px 3px; width: 44%;">THAI</th></tr></thead><tbody>${rowsHtml}</tbody></table>`;
    
    const tempDiv = document.createElement('div');
    tempDiv.innerHTML = `<table><tbody>${rowsHtml}</tbody></table>`;
    const plainText = Array.from(tempDiv.querySelectorAll("tr")).map(tr => Array.from(tr.querySelectorAll("td")).map(td => td.innerText).join("\t")).join("\n");

    try {
        await navigator.clipboard.write([new ClipboardItem({ "text/html": new Blob([styledHtml], { type: "text/html" }), "text/plain": new Blob([plainText], { type: "text/plain" }) })]);
        alert("Copied Recent Table!");
    } catch (err) {
        alert("Copy failed!");
    }
}

async function copyTable() {
    const table = document.getElementById("output");
    const rowsHtml = Array.from(table.querySelectorAll("tbody tr")).map(tr => {
        const tds = Array.from(tr.querySelectorAll("td:not(.action-col)")).map(td => {
            const tempTd = document.createElement("td");
            tempTd.style.cssText = "border: 1px solid #000000; padding: 2px 3px; vertical-align: top; white-space: pre-wrap;";
            tempTd.textContent = td.textContent;
            return tempTd.outerHTML;
        }).join("");
        return `<tr>${tds}</tr>`;
    }).join("");

    const styledHtml = `<table style="border-collapse: collapse; font-family: Arial, sans-serif; font-size: 13px;"><thead><tr><th style="background-color: #A9D18E; border: 1px solid #000000; text-align: center; vertical-align: middle; font-weight: normal; height: 25px; padding: 1px 3px; width: 24.5%;">KEY</th><th style="background-color: #A9D18E; border: 1px solid #000000; text-align: center; vertical-align: middle; font-weight: normal; height: 25px; padding: 1px 3px; width: 31.5%;">ENG</th><th style="background-color: #A9D18E; border: 1px solid #000000; text-align: center; vertical-align: middle; font-weight: normal; height: 25px; padding: 1px 3px; width: 44%;">THAI</th></tr></thead><tbody>${rowsHtml}</tbody></table>`;
    
    const tempDiv = document.createElement('div');
    tempDiv.innerHTML = `<table><tbody>${rowsHtml}</tbody></table>`;
    const plainText = Array.from(tempDiv.querySelectorAll("tr")).map(tr => Array.from(tr.querySelectorAll("td")).map(td => td.innerText).join("\t")).join("\n");

    try {
        await navigator.clipboard.write([new ClipboardItem({ "text/html": new Blob([styledHtml], { type: "text/html" }), "text/plain": new Blob([plainText], { type: "text/plain" }) })]);
        const status = document.getElementById("copyStatus");
        if (status) { status.textContent = "Copied with Format!"; setTimeout(() => status.textContent = "", 1500); }

        alert("Copy failed!");
    }
}

function clearAll() {
    document.getElementById("thaiInput").value = "";
    document.getElementById("engInput").value = "";
    
    const searchInput = document.getElementById("searchInput");
    searchInput.value = "";
    searchInput.disabled = true;
    searchInput.placeholder = "กรุณากด Fetch CDN หรือ Upload ไฟล์ JSON ก่อนเพื่อค้นหา...";
    
    globalCdnMap.clear();
    document.querySelector("#output tbody").innerHTML = "";
    const status = document.getElementById("copyStatus");
    if (status) status.textContent = "";
}

function clearHistory() {
    if (confirm("ต้องการล้างประวัติทั้งหมดใช่หรือไม่?")) {
        localStorage.removeItem('table_history');
        renderRecentHistory();
    }
}

window.onload = function() {
    renderCdnHistory();
    renderRecentHistory();
};
